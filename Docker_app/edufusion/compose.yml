services:
  frontend:
    build:
      context: ./Frontend/edufusion-frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5001
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001
    ports:
      - "3001:3000"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    environment:
      OLLAMA_URL: http://ai-service:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      - ai-service

  ai-service:
    build: ./ai_layer
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
